name: CI

# Desactivado: solo se lanza a mano desde Actions (docs/adr/0017). Lo mismo
# corre en local con los hooks de git: scripts/ci.sh fast antes de cada commit
# y scripts/ci.sh full antes de cada push. Para reactivarlo, devolver aquí
# `push: branches: [main]` y `pull_request:`.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formato y lint
        run: npm run lint

      - name: Tipos
        run: npm run check

      - name: Build estático
        run: npm run build

      # La landing se prerenderiza entera; si el build no deja un index.html
      # con contenido, se ha roto el prerender sin que el build fallara.
      - name: Comprobar que el prerender produjo HTML
        run: |
          test -f build/index.html
          grep -q 'battle royale' build/index.html

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium

      # playwright.config.ts levanta `npm run build && npm run preview`: las
      # pruebas corren contra el build de producción, no contra el dev server.
      - name: Ejecutar E2E
        run: npx playwright test

      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
